[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sim3d"
version = "0.1.0"
description = "3D Mechanistic Reservoir-to-Seismic & 4D Inversion Laboratory"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "xarray>=2023.1",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
accel = ["numba>=0.58"]
viz = ["matplotlib>=3.7", "plotly>=5.0"]
dev = ["pytest>=7.0"]

[project.scripts]
sim3d = "sim3d.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: long-running numerical benchmarks"]
