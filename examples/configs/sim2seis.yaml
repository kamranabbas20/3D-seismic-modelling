# sim2seis: the geological model converted into a synthetic seismic volume.
#
# Same earth as demo_small.yaml, but the seismic step converts the whole
# model column by column instead of propagating and migrating a survey.
# Four earth models x three angle stacks in seconds; the flow simulation
# upstream is what takes the time.
#
# What you get: a 3D cube per angle stack per scenario, in two-way time and
# in depth, the 4D differences between them, and NRMS by stack.
#
# What you do not get, and cannot: lateral propagation, diffraction,
# multiples, illumination, offset-to-angle mapping, or migration - so
# dipping structure is mispositioned and the stacks are constant-angle.
# It models what the reservoir would look like in seismic, not what the
# survey would record.
#
#     sim3d sim2seis examples/configs/sim2seis.yaml

project:
  name: sim2seis
  description: A synthetic seismic volume converted from the earth model
  seed: 1

domains:
  geology_bounds: [[0, 2000], [0, 2000], [0, 1800]]
  geology_spacing: [25.0, 25.0, 10.0]
  # The wave-equation domain is a fraction of the geological model, and the
  # target window a fraction of that again (spec section 6).
  propagation_bounds: [[500, 1500], [500, 1500], [700, 1600]]
  propagation_spacing: [16.0, 16.0, 16.0]
  target_bounds: [[700, 1300], [700, 1300], [1100, 1300]]

geology:
  template: flat
  parameters:
    z_reservoir: 1150.0
    gross: 100.0
    seed: 1

wells:
  pattern: line_drive
  parameters:
    centre: [1000.0, 1000.0]
    spacing: 600.0
    n_injectors: 1
    n_producers: 1
    separation: 600.0
    perforation: [1150.0, 1250.0]

reservoir:
  baseline:
    sw: 0.30
    sg: 0.0
    temperature: 75.0
    pressure_gradient: 10500.0
  scenario:
    name: monitor
    time_state: T4
    pressure:
      - {well: I1, delta_p_bar: 45.0, radius: [500.0, 500.0, 140.0]}
      - {well: P1, delta_p_bar: -55.0, radius: [450.0, 450.0, 140.0]}
    water_fronts:
      - {well: I1, target_sw: 0.78, radius: [220.0, 220.0, 70.0]}
    gas:
      - {well: P1, target_sg: 0.08, radius: [180.0, 180.0, 60.0]}

rock_physics:
  mineral_model: vrh
  dry_frame_model: soft_sand
  fluid_mixing: wood
  pressure_model: hertz_mindlin
  temperature: 75.0
  salinity: 40000.0
  api: 32.0
  gor: 90.0

solver:
  physics: acoustic
  spatial_order: 8
  courant_safety: 0.90
  pml_nodes: 12
  dtype: float32
  backend: auto
  record_length: 0.9

source:
  type: ricker
  frequency: 8.0

acquisition:
  type: OBN
  centre: [1000.0, 1000.0]
  receiver_spacing: 100.0
  receiver_extent: 500.0
  source_spacing: 250.0
  source_line_spacing: 250.0
  source_extent: 500.0
  # Both must sit inside the absorbing layer's inner edge, which for a
  # 12-node PML at 16 m is 192 m in from every face: here z >= 892 m.
  receiver_depth: 960.0
  source_depth: 940.0

imaging:
  # RTM migrates the modelled gathers. Set this to sparse_synthetic for the
  # second seismic mode, which skips propagation entirely and builds K
  # vertical 1D traces instead - seconds rather than minutes, and a
  # screening result rather than an image.
  method: sim2seis
  imaging_condition: source_normalized
  laplacian_filter: true

synthetic:
  # One trace per well. Switch to 'grid' with a count to spread exactly K
  # traces over the target instead, or 'points' for explicit [x, y] pairs.
  layout: wells
  count: 9
  points: []

sim2seis:
  # The synthetic seismic volume: the whole earth model converted column by
  # column, in angle stacks. Near and far respond differently to a fluid
  # change and to a pressure change, which is the discrimination the stacks
  # exist to give you.
  stacks:
    - {name: near, angles: [0.0, 15.0]}
    - {name: mid, angles: [15.0, 30.0]}
    - {name: far, angles: [30.0, 45.0]}
  sub_angles: 5
  map_to_depth: true
  # Left unset, the time axis runs to the deepest two-way time in the model
  # and the sample interval is the coarsest conventional one that still
  # gives eight samples per period at the top of the band. Note this is not
  # solver.record_length: that is a survey's listening time from sources
  # near the reservoir, while a synthetic column is timed from the surface.
  sample_interval: null
  record_length: null

fourd:
  scenarios: [baseline, pressure_only, saturation_only, combined]

budget:
  max_ram_gb: 8.0
  max_disk_gb: 50.0
  max_cost_class: HIGH

output:
  directory: runs
