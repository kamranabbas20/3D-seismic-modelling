# The five-layer line survey, widened to cover the flood.
#
# The earlier surveys were sized from `target_bounds`, and that window was
# drawn around the two wells: x = 700 to 1,300 m. The flood is not centred
# on the well pair. It runs from x = 225 to 1,300 m - 475 m west of the
# injector - so 377 m of it sat outside the westernmost source and the
# migration drew nothing there. sim2seis filled that ground because a 1D
# convolution needs no illumination; the migration reported, correctly,
# that it had no data.
#
# The survey now spans 160 to 1,840 m, which covers the flood with room
# either side. Full +/-45 degree illumination of the western edge would
# want sources 900 m beyond it - the reflector is 900 m below the shots -
# and that lands outside the 2 km model, so the west flank is still lit
# from one side only. This is as wide as the model allows, not as wide as
# the physics would like, and the difference is worth knowing.
#
# The five-layer line survey with the sources lifted away from the receivers.
#
# The five-layer model shot as a LINE rather than as a carpet.
#
# Everything about the earth is identical to five_layer_4d. What changes is
# the survey and the propagation domain: one shot line along y = 1,000 m
# instead of a 5 x 5 carpet, and a 400 m wide slab of model instead of a
# 1,100 m square. The wave equation is still solved in three dimensions and
# geometrical spreading is still 3D - this is 2.5D, not 2D - but the domain
# is only as wide as it needs to be to hold the line and its absorbing
# layer.
#
# 1.3e10 cell-steps against 8.9e10 for the carpet: about seven times less
# work for one section, which is what makes it the right tool for asking a
# question about one section. The cost is crossline aperture, and QC says so
# rather than letting it pass silently: nothing off the line is illuminated,
# so anything with out-of-plane structure would be mispositioned. On a flat
# layered model there is none, which is exactly why this model can afford it.
#
# Shale, sand, shale, sand, shale - and only the thin fourth unit changes.
#
# This model exists to answer a question the three-layer case could not. There,
# the only reflectors in the whole model were the target's own, so everything a
# migration drew above the reservoir was artefact with nothing to compete
# against, and the image was dominated by the acquisition near-field and by
# migration smiles. Here the 500 m interval between the acquisition and the
# target carries two strong, inert interfaces:
#
#   0 -  500 m   shale
# 500 - 1000 m   sand        <- thick, bright, and nothing ever happens in it
#1000 - 1050 m   shale (seal)
#1050 - 1080 m   sand        <- the reservoir: injection, production, the 4D
#1080 -          shale
#
# The upper sand is marked `is_reservoir: false` in the template, so no cell in
# it is ever given to the flow simulation. It should reproduce identically in
# the baseline and the monitor and difference to zero. A 4D anomaly on it would
# be a bug in the modelling or the imaging, and that is exactly what makes it
# worth having: an internal control the three-layer model does not provide.
#
# The 30 m target is thinner than the seismic can resolve - a quarter
# wavelength here is about 55 m - so its top and base interfere into one
# composite event and the 4D appears as an amplitude change rather than as two
# separable interfaces. That is how a thin reservoir behaves in real 4D.
#
project:
  name: five_layer_600m
  description: >
    Five flat layers with a reflective, inert overburden above a thin 30 m
    reservoir; one injector and one producer 600 m apart, three years,
    imaged by 1D convolution and by full-wave modelling with RTM.
  seed: 1

domains:
  # 5 m vertical sampling: a 30 m reservoir on a 10 m grid is three cells,
  # which is too few for the flow front and for the rock physics that reads it.
  geology_bounds: [[0, 2000], [0, 2000], [0, 1200]]
  geology_spacing: [25.0, 25.0, 5.0]
  # 12 m isotropic. At Fmax 28.8 Hz and Vmin about 2,000 m/s the shortest
  # wavelength is 70 m, sampled at 5.8 cells against the 5.25 an 8th-order
  # operator needs.
  propagation_bounds: [[0, 1992], [800, 1200], [0, 1000]]
  # 8 m. QC warns that the slowest cell samples the shortest wavelength at
  # 4.94 cells where an 8th-order operator wants 5.25 - about 1.2 % phase
  # error instead of 1.0 %. Taken deliberately: 7.5 m would clear it and
  # costs 1.3x the cells and 1.3x the steps, and both surveys disperse
  # identically, so the error cancels in the 4D difference that this model
  # exists to measure. It does not cancel in the baseline image, which is
  # the part to read with the caveat.
  propagation_spacing: [8.0, 8.0, 8.0]
  target_bounds: [[200, 1400], [960, 1040], [520, 760]]

geology:
  template: five_layer
  parameters:
    extent: [2000.0, 2000.0, 1800.0]
    # Reservoir top at 300 + 250 + 50 = 600 m.
    overburden_shale: 300.0
    upper_sand: 250.0
    seal: 50.0
    gross: 30.0
    base_shale: 50.0
    seed: 1

rock_physics:
  # 15, not the 100 the library defaults to. GOR is in m3/m3, so 100 is
  # 562 scf/STB, whose bubble point by Standing is about 2,790 psi - and this
  # reservoir never sees more than 1,303 psi, or less than 794. The oil would
  # have been two-phase everywhere, always, while the flow model (which has no
  # gas phase at all) carried it as single-phase liquid. 15 m3/m3 is 84
  # scf/STB and Pb about 558 psi, below both the minimum reservoir pressure
  # and the 600 psi producer BHP, so the two halves of the model agree.
  #
  # It is not cosmetic: the dissolved gas was softening the oil enough to
  # inflate the 4D response by a fifth, from 2.06 % to 2.61 % |dAI|/AI.
  gor: 15.0
  dry_frame_model: soft_sand
  critical_porosity: 0.40
  coordination: 9.0
  temperature: 60.0
  facies:
    shale:
      dry_frame_model: stiff_sand
      critical_porosity: 0.55
      coordination: 6.0

reservoir:
  source: flow
  baseline:
    sw: 0.25
    temperature: 60.0
    pressure_gradient: 10500.0
    datum_pressure: 101325.0

wells:
  wells:
    - name: I1
      role: injector
      x: 700.0
      y: 1000.0
      completions: [reservoir]
      control: water_rate
      target: 12000.0
      # The fracture pressure at 615 m is 1,412 psi on a 0.7 psi/ft gradient,
      # against an initial 951 psi from this file's own 10,500 Pa/m. The
      # limit was 2,400 psi - the value from the 1,050 m version of this
      # model, carried over unchanged - and the injector ran at 2,013 psi,
      # some 600 psi above fracture. It inflated the whole reservoir by 199
      # to 911 psi, and because a pressure rise softens the rock while water
      # replacing oil stiffens it, the two changes cancelled inside the
      # flood and left the biggest impedance change on the *unswept* rock:
      # 7.8 % outside the flood against 2.1 % inside it. The 4D was
      # measuring the overpressure, not the waterflood.
      bhp_limit_psi: 1380.0
    - name: P1
      role: producer
      x: 1300.0
      y: 1000.0
      completions: [reservoir]
      control: liquid_rate
      target: 12000.0          # VRR 1.0
      bhp_limit_psi: 600.0

simulation:
  duration_days: 1095.0
  report_every_days: 45.625
  max_timestep_days: 30.0
  monitor_day: 1095.0
  swc: 0.25
  sor: 0.25
  krw_max: 0.35
  kro_max: 0.90
  water_viscosity_cp: 0.45
  oil_viscosity_cp: 1.2
  gravity: true

solver:
  pml_nodes: 10
  # The absorbing layer takes 10 x 12 = 120 m, so nothing may sit above 320 m.
  record_length: 0.70

source:
  type: ricker
  # 18 Hz, not 12. A 600 m target needs the acquisition within 480 m of it,
  # and at 12 Hz two wavelengths is 442 m - there is no room for both the
  # standoff and the source-receiver separation. Halving the wavelength
  # makes both fit; the cost is a finer grid, which dispersion sets.
  frequency: 18.0

acquisition:
  type: OBN
  # 650 m above the target: 2.6 wavelengths at the 12 Hz peak, clear of the
  # near-field zone that ruined an earlier demo at 0.55.
  receiver_depth: 300.0
  # 150 m, not 380. With both at ~390 m the sources and receivers sat 20 m
  # apart, so their injection near-fields occupied the same slab of model
  # and reinforced each other - that band carried 0.41 RMS against the
  # target's 0.048. Separating them by 250 m is the one variable this
  # configuration changes against five_layer_2d; the receivers stay at
  # 400 m so their 650 m standoff from the target is untouched and the
  # comparison is clean.
  #
  # The absorbing layer claims the first 120 m of the domain, so 150 m is
  # about as shallow as a source can legally sit.
  source_depth: 120.0
  receiver_spacing: 60.0
  source_spacing: 100.0
  source_line_spacing: 200.0
  # Set explicitly: left unset these are derived from the target plus a
  # margin on every side, and narrowing the target crossline to match the
  # slab would shrink the inline footprint with it - two shots instead of
  # eleven.
  receiver_extent: 1820.0
  source_extent: 1800.0
  # A line, not a carpet. `source_extent_y` smaller than `source_line_spacing`
  # leaves exactly one shot line at the survey centre; the receivers keep
  # three lines either side of it, which costs nothing - the receiver
  # wavefield is back-propagated as one field however many receivers are in
  # it, so only the shot count multiplies the work.
  receiver_extent_y: 120.0
  source_extent_y: 1.0

imaging:
  method: RTM
  imaging_condition: source_normalized
  laplacian_filter: true

sim2seis:
  map_to_depth: true
  time_shifts: true
  noise:
    level: 0.05
    repeatability: 0.75
    seed: 7

fourd:
  scenarios: [baseline, combined]

budget:
  max_ram_gb: 8.0
  max_disk_gb: 50.0
  max_cost_class: HIGH

output:
  directory: runs
